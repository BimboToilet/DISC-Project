{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-brand"><span>◆</span> TeamDISC</div>
  <p class="auth-sub">Создайте аккаунт для работы с командами и опросами</p>
  <div class="card">
    <div class="card-title">Регистрация</div>
    <form method="post">
      <div class="form-group">
        <label for="display_name">Имя (видно другим пользователям)</label>
        <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}" required>
      </div>
      <div class="form-group">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" required>
        <div class="hint">Латиница, цифры, «_» и «.»</div>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-group">
        <label for="password2">Повторите пароль</label>
        <input type="password" id="password2" name="password2" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Зарегистрироваться</button>
    </form>
    <hr class="divider">
    <p class="small muted">Уже есть аккаунт? <a class="muted-link" href="{{ url_for('auth.login') }}">Войти</a></p>
  </div>
</div>
{% endblock %}
