{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-brand"><span>◆</span> Team Compass</div>
  <div class="card">
    <div class="card-title">Вход в систему</div>
    <form method="post">
      <div class="form-group">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" autofocus required>
      </div>
      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Войти</button>
    </form>
    <hr class="divider">
    <p class="small muted">Нет аккаунта? <a class="muted-link" href="{{ url_for('auth.register') }}">Зарегистрируйтесь</a></p>
  </div>
</div>
{% endblock %}
